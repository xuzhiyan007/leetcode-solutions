name: LeetCode Sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *" # UTC 每天一次（北京时间次日凌晨 2 点）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # commit 作者指向本人账号，贡献格子才会点亮
      - name: Set git identity
        run: |
          git config --global user.name "xuzhiyan007"
          git config --global user.email "184539247+xuzhiyan007@users.noreply.github.com"

      - name: Sync
        uses: JacobLinCool/leetcode-sync@v2
        with:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
